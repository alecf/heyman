# GoReleaser configuration for heyman (GoReleaser v2)
# Validate with: goreleaser check
version: 2

project_name: heyman

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # cmd/heyman/main.go reads these for --version.
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    main: ./cmd/heyman

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Homebrew cask in github.com/alecf/homebrew-tap (Casks/heyman.rb).
# Install with: brew install --cask alecf/tap/heyman
homebrew_casks:
  - name: heyman
    homepage: https://github.com/alecf/heyman
    description: "Turn plain-English requests into shell commands, checked against local man pages"
    license: "MIT"
    repository:
      owner: alecf
      name: homebrew-tap
    directory: Casks
    binaries:
      - heyman
    hooks:
      post:
        # Release binaries aren't notarized; clear the quarantine flag so
        # macOS will run them.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/heyman"]
          end
